name: Security checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: node --test tests/*.test.cjs
      - run: node scripts/check-js-syntax.cjs
      - run: node scripts/check-tracked-secrets.cjs
